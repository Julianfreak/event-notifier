name: CI/CD Pipeline - Event Notifier

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Continuous Integration (CI) - Tests & Quality
    runs-on: ubuntu-latest
    
    # Servicios auxiliares si se requieren pruebas de integración futuras, 
    # aunque el proyecto base utiliza pruebas unitarias con mocks.
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '^1.24'

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests and Enforce 85% Coverage
        run: |
          # 1. Ejecutar las pruebas generando un archivo de reporte de cobertura
          go test -coverprofile=coverage.out ./internal/core/services/...
          
          # 2. Extraer el porcentaje de la línea total del reporte
          COVERAGE_STR=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}')
          echo "Cobertura total obtenida: $COVERAGE_STR"
          
          # 3. Remover el carácter '%' para obtener el valor numérico puro
          COVERAGE_NUM=${COVERAGE_STR%\%}
          
          # 4. Validar que la cobertura sea >= 85.0% utilizando awk
          PASSED=$(awk -v cov="$COVERAGE_NUM" 'BEGIN {print (cov >= 85.0) ? "1" : "0"}')
          
          if [ "$PASSED" -eq "1" ]; then
            echo "¡Éxito! La cobertura de código cumple con el estándar requerido (>85%)."
          else
            echo "Error: La cobertura actual ($COVERAGE_NUM%) es inferior al umbral mínimo del 85%."
            exit 1
          fi

  build-and-push:
    name: Continuous Deployment (CD) - Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: saavedrabackdev/event-notifier:latest